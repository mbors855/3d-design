<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Digital Denture CAD</title><style>body{margin:0;background:#101722;color:#e9f0f8;font:15px system-ui}header{padding:12px;background:#1b2737;font-weight:700}#tools{display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:#172231}button,label{background:#30465e;border:0;border-radius:8px;padding:10px;color:white;cursor:pointer}input{display:none}#view{width:100%;height:65vh;touch-action:none}small{display:block;padding:10px;color:#aebdcb}</style></head><body><header>🦷 Digital Denture CAD · STL Workspace 0.1</header><div id="tools"><label>STL openen<input type="file" id="file" accept=".stl"></label><button id="export">STL exporteren</button><button id="reset">Camera herstellen</button><button id="clear">Model wissen</button></div><div id="view"></div><small id="status">Open een STL-model. Eén vinger: draaien · twee vingers: zoomen/verschuiven. Deze eerste versie is een STL-viewer met export, nog geen prothese-editor of klinisch gevalideerd CAD.</small><script type="module">
import * as THREE from 'https://esm.sh/three@0.169.0';
import {OrbitControls} from 'https://esm.sh/three@0.169.0/examples/jsm/controls/OrbitControls.js';
import {STLLoader} from 'https://esm.sh/three@0.169.0/examples/jsm/loaders/STLLoader.js';
import {STLExporter} from 'https://esm.sh/three@0.169.0/examples/jsm/exporters/STLExporter.js';
const host=document.getElementById('view'),status=document.getElementById('status');let mesh=null;
const scene=new THREE.Scene();scene.background=new THREE.Color('#101722');const camera=new THREE.PerspectiveCamera(45,1,.01,100000);camera.position.set(0,0,150);scene.add(new THREE.HemisphereLight(0xffffff,0x445566,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(40,80,100);scene.add(light);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;function resize(){let w=host.clientWidth,h=host.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}window.addEventListener('resize',resize);resize();function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera)}frame();function fit(){if(!mesh)return;const b=new THREE.Box3().setFromObject(mesh),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());controls.target.copy(c);camera.position.copy(c).add(new THREE.Vector3(s.length()*.8,s.length()*.5,s.length()*1.5));camera.near=Math.max(.001,s.length()/10000);camera.far=Math.max(1000,s.length()*100);camera.updateProjectionMatrix();controls.update()}
document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=await f.arrayBuffer();const geometry=new STLLoader().parse(data);geometry.computeVertexNormals();if(mesh){scene.remove(mesh);mesh.geometry.dispose()}mesh=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({color:0xe7b4a9,roughness:.72,metalness:0,side:THREE.DoubleSide}));scene.add(mesh);fit();status.textContent=`Geopend: ${f.name} · ${geometry.attributes.position.count/3|0} driehoeken. STL bevat geen patiëntgegevens of eenheden; controleer de schaal.`}catch(err){status.textContent='STL kon niet worden geopend: '+err.message}};
document.getElementById('export').onclick=()=>{if(!mesh){status.textContent='Open eerst een STL-bestand.';return}const out=new STLExporter().parse(mesh,{binary:true});const blob=new Blob([out],{type:'application/octet-stream'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='denturecad_export.stl';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('reset').onclick=fit;document.getElementById('clear').onclick=()=>{if(mesh){scene.remove(mesh);mesh.geometry.dispose();mesh=null}status.textContent='Model gewist.'};
</script></body></html>
